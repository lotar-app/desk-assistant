openapi: 3.1.0
info:
  title: Desk Action API
  version: 1.4.0
  description: API for updating Desk and reading project and workspace context.
servers:
  - url: https://twilight-rice-7a74.fastmax.workers.dev
paths:
  /:
    post:
      operationId: updateDesk
      x-openai-isConsequential: false
      summary: Update Desk from a conversation
      description: >
        Sends a structured project update to Desk when the conversation contains
        a clear advancement, decision, next action, task, or timeline event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectName
                - data
              additionalProperties: false
              properties:
                projectName:
                  type: string
                  description: >
                    Human-readable project name. Desk finds the existing project
                    or creates it when necessary.
                data:
                  type: object
                  required:
                    - summary
                    - focus
                    - nextAction
                    - status
                    - newTasks
                    - completedTasks
                    - timelineEvent
                  additionalProperties: false
                  properties:
                    summary:
                      type: string
                      description: Short factual summary of the update.
                    focus:
                      type: string
                      description: Current operational focus after the update.
                    nextAction:
                      type: string
                      description: Next concrete action to take.
                    status:
                      type: string
                      enum:
                        - IN_PROGRESS
                        - WAITING
                        - DONE
                        - PAUSED
                      description: Current project status.
                    newTasks:
                      type: array
                      description: New concrete tasks to create.
                      items:
                        type: string
                    completedTasks:
                      type: array
                      description: Exact task IDs to mark as completed.
                      items:
                        type: string
                    timelineEvent:
                      type: string
                      description: Concise operational event to record in the timeline.
      responses:
        "200":
          description: Desk update response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                additionalProperties: true
                properties:
                  success:
                    type: boolean
                  result:
                    type: object
                    additionalProperties: true
                  error:
                    type: string
  /getProject:
    post:
      operationId: getProject
      x-openai-isConsequential: false
      summary: Read a Desk project
      description: Returns the project whose human-readable name matches the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectName
              additionalProperties: false
              properties:
                projectName:
                  type: string
                  description: Human-readable name of the project to retrieve.
      responses:
        "200":
          description: Project lookup response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - httpStatus
                  - result
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  httpStatus:
                    type: integer
                  result:
                    type: object
                    additionalProperties: true
                    description: Result returned by Desk.
  /project-tasks:
    post:
      operationId: getProjectTasks
      x-openai-isConsequential: false
      summary: Read all tasks for a Desk project
      description: Returns the complete task list for the project whose name matches the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectName
              additionalProperties: false
              properties:
                projectName:
                  type: string
                  description: Human-readable name of the project whose tasks should be retrieved.
      responses:
        "200":
          description: Project task lookup response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - httpStatus
                  - result
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  httpStatus:
                    type: integer
                  result:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - success
                          - projectId
                          - projectName
                          - tasks
                        properties:
                          success:
                            type: boolean
                            const: true
                          projectId:
                            type: string
                          projectName:
                            type: string
                          tasks:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - id
                                - projectId
                                - title
                                - description
                                - status
                                - priority
                                - assignee
                                - dueDate
                                - createdAt
                                - updatedAt
                                - completedAt
                              properties:
                                id:
                                  type: string
                                projectId:
                                  type: string
                                title:
                                  type: string
                                description:
                                  type: string
                                status:
                                  type: string
                                priority:
                                  type: string
                                assignee:
                                  type: string
                                dueDate:
                                  type: string
                                createdAt:
                                  type: string
                                updatedAt:
                                  type: string
                                completedAt:
                                  type: string
                      - type: object
                        additionalProperties: false
                        required:
                          - success
                          - error
                        properties:
                          success:
                            type: boolean
                            const: false
                          error:
                            type: string
                            const: PROJECT_NOT_FOUND
  /project-activity:
    post:
      operationId: getProjectActivity
      x-openai-isConsequential: false
      summary: Read a consolidated ProjectActivity snapshot
      description: >
        Resolves a project activity by direct ID or exact normalized alias and
        returns its current D1 snapshot. It never reads Timeline, creates data,
        or performs fuzzy or semantic search. A global ambiguous alias returns
        AMBIGUOUS_ACTIVITY with minimal candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
              anyOf:
                - required: [activityId]
                - required: [activity]
              properties:
                action:
                  type: string
                  const: getProjectActivity
                projectId:
                  type: string
                projectName:
                  type: string
                activityId:
                  type: string
                activity:
                  type: string
                  description: Exact canonical name or alias after normalization.
                mode:
                  type: string
                  enum: [COMPACT, FULL, KEYS]
                  default: COMPACT
                keys:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: Required only in KEYS mode.
      responses:
        "200":
          description: Current ProjectActivity snapshot without Timeline or revisions
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - activityId
                  - projectId
                  - canonicalName
                  - schemaVersion
                  - snapshotVersion
                  - mode
                  - activity
                additionalProperties: true
                properties:
                  success:
                    type: boolean
                    const: true
                  activityId:
                    type: string
                  projectId:
                    type: string
                  canonicalName:
                    type: string
                  schemaVersion:
                    type: integer
                  snapshotVersion:
                    type: integer
                  mode:
                    type: string
                    enum: [COMPACT, FULL, KEYS]
                  activity:
                    type: object
                    additionalProperties: true
                  items:
                    type: object
                    additionalProperties: true
                  decisionsApproved:
                    type: object
                    additionalProperties: true
                  technicalContext:
                    type: object
                    additionalProperties: true
                  technicalContextIndex:
                    type: object
                    additionalProperties: true
                  contentsApproved:
                    type: object
                    additionalProperties: true
                  approvedContentIndex:
                    type: object
                    additionalProperties: true
        "400":
          description: INVALID_MODE or INVALID_KEYS
        "404":
          description: PROJECT_NOT_FOUND or ACTIVITY_NOT_FOUND
        "409":
          description: AMBIGUOUS_ACTIVITY with candidate project and activity IDs
        "500":
          description: INTERNAL_ERROR
        "503":
          description: D1_NOT_CONFIGURED
  /project-activity/update:
    post:
      operationId: updateProjectActivity
      x-openai-isConsequential: true
      summary: Atomically create or update a ProjectActivity snapshot
      description: >
        Applies an explicit versioned and idempotent D1 mutation. It never
        creates Projects and does not deliver the resulting outbox event to
        Apps Script in Phase 2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
                - project
                - activity
                - expectedSnapshotVersion
                - idempotencyKey
              properties:
                action:
                  type: string
                  const: updateProjectActivity
                project:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    name: { type: string }
                  anyOf:
                    - required: [id]
                    - required: [name]
                activity:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    name: { type: string }
                    kind: { type: string }
                    createIfMissing: { type: boolean, default: false }
                  anyOf:
                    - required: [id]
                    - required: [name]
                expectedSnapshotVersion:
                  type: integer
                  minimum: 0
                  description: Existing version, or exactly 0 for creation.
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 200
                patch:
                  type: object
                  additionalProperties: false
                  properties:
                    set:
                      type: object
                      additionalProperties: false
                      properties:
                        status: { type: string }
                        focus: { type: string }
                        nextAction: { type: string }
                        summary: { type: string }
                    clear:
                      type: array
                      uniqueItems: true
                      items:
                        type: string
                        enum: [status, focus, nextAction, summary]
                items:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [op, key, value]
                        properties:
                          op: { type: string, const: UPSERT }
                          key: { type: string, minLength: 1 }
                          type:
                            type: string
                            enum: [DECISION, CONTENT, TECHNICAL_CONTEXT]
                          value: {}
                          approvedAt: { type: string, format: date-time }
                          reason: { type: string }
                      - type: object
                        additionalProperties: false
                        required: [op, key, reason]
                        properties:
                          op: { type: string, const: DELETE }
                          key: { type: string, minLength: 1 }
                          reason: { type: string, minLength: 1 }
                aliases:
                  type: object
                  additionalProperties: false
                  properties:
                    add:
                      type: array
                      uniqueItems: true
                      items: { type: string }
                    remove:
                      type: array
                      uniqueItems: true
                      items: { type: string }
                timeline:
                  type: object
                  additionalProperties: false
                  properties:
                    mode: { type: string, enum: [AUTO] }
                    summary: { type: string }
                source:
                  type: object
                  additionalProperties: true
                  properties:
                    type: { type: string }
                    conversationId: { type: string }
      responses:
        "200":
          description: Applied or idempotently replayed update
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - activityId
                  - projectId
                  - created
                  - noOp
                  - snapshotVersion
                  - changedKeys
                  - timelineEventId
                  - timelineDelivery
                  - snapshot
                properties:
                  success: { type: boolean, const: true }
                  activityId: { type: string }
                  projectId: { type: string }
                  created: { type: boolean }
                  noOp: { type: boolean }
                  snapshotVersion: { type: integer }
                  changedKeys:
                    type: array
                    items: { type: string }
                  timelineEventId:
                    type: [string, "null"]
                  timelineDelivery:
                    type: [string, "null"]
                    enum: [PENDING, null]
                  snapshot:
                    type: object
                    additionalProperties: true
        "400":
          description: INVALID_PATCH, INVALID_ITEM_OPERATION, or INVALID_ITEM_TYPE
        "404":
          description: PROJECT_NOT_FOUND or ACTIVITY_NOT_FOUND
        "409":
          description: SNAPSHOT_VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, or ALIAS_CONFLICT
        "500":
          description: INTERNAL_ERROR
        "503":
          description: D1_NOT_CONFIGURED
  /workspace-briefing:
    post:
      operationId: getWorkspaceBriefing
      x-openai-isConsequential: false
      summary: Read a Desk workspace or project briefing
      description: >
        Returns a read-only operational briefing built from projects, open tasks,
        and timeline events. With no target it selects LOTAR. A supplied target
        is resolved first as a supported workspace name and then as a project
        name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              additionalProperties: false
              properties:
                action:
                  type: string
                  const: getWorkspaceBriefing
                workspace:
                  type: string
                  description: Optional workspace or project name. Omission selects LOTAR.
      responses:
        "200":
          description: Current read-only Desk workspace or project briefing
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - httpStatus
                  - result
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  httpStatus:
                    type: integer
                  result:
                    type: object
                    additionalProperties: false
                    required:
                      - success
                    properties:
                      success:
                        type: boolean
                      briefing:
                        type: object
                        additionalProperties: false
                        properties:
                          generatedAt:
                            type: string
                            format: date-time
                          date:
                            type: string
                            format: date
                          timezone:
                            type: string
                          scope:
                            type: string
                          workspaceId:
                            type: string
                          workspace:
                            type: string
                          workspaces:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                          counts:
                            type: object
                            additionalProperties: true
                          recentContext:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          attentionSignals:
                            type: object
                            additionalProperties: true
                          recordedPriorities:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          availableNextActions:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          waitingContext:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          candidateStartingPoints:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          dataQuality:
                            type: object
                            additionalProperties: true
                      error:
                        type: string
